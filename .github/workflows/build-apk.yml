name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-venv build-essential libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libglib2.0-0 libsm6 libxrender1 libxext6 openjdk-17-jdk zip ant wget unzip autoconf libltdl-dev libtool pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev libsqlite3-dev cmake
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate SDK and accept licenses
        id: locate_sdk
        run: |
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT
          
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "build-tools;34.0.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          
          echo "sdk_root=$ANDROID_SDK_ROOT" >> "$GITHUB_OUTPUT"
          ls -la $ANDROID_SDK_ROOT/ndk

      - name: Setup buildozer environment
        run: |
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          mkdir -p ~/.buildozer/android/platform
          rm -rf ~/.buildozer/android/platform/android-sdk 2>/dev/null || true
          rm -rf ~/.buildozer/android/platform/android-ndk-r28c 2>/dev/null || true
          ln -s "$ANDROID_SDK_ROOT" ~/.buildozer/android/platform/android-sdk

      - name: Prepare mobile app
        env:
          SDK_PATH: /usr/local/lib/android/sdk
        run: |
          mkdir -p mobile_app
          mv mobile_app.py mobile_app/main.py
          cat > mobile_app/buildozer.spec << 'EOF'
[app]
title = PC Controller
package.name = controllerapp
package.domain = org.yourname
source.dir = .
source.include_exts = py,png,jpg,kv,atlas
version = 0.1
requirements = python3,kivy,plyer
orientation = landscape
fullscreen = 1
android.permissions = INTERNET,VIBRATE
android.archs = arm64-v8a

[android]
android.accept_sdk_license = True
android.min_api = 24
android.api = 33
android.ndk_path = /usr/local/lib/android/sdk/ndk/27.2.12479018
android.sdk_path = /usr/local/lib/android/sdk
android.skip_update = True
android.useAndroidX = True

[buildozer]
log_level = 2
warn_on_root = 1
EOF
          cat mobile_app/buildozer.spec

      - name: Install Buildozer
        working-directory: mobile_app
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install buildozer cython==3.0.10 numpy==1.24.3 kivy==2.3.0 plyer

      - name: Build APK
        working-directory: mobile_app
        timeout-minutes: 45
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.2.12479018
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/27.2.12479018
          P4A_NDK_VERSION: 27.2.12479018
          P4A_BOOTSTRAP: sdl2
        run: |
          source venv/bin/activate
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: controller-app-apk
          path: mobile_app/bin/*.apk

      - name: Debug (if failed)
        if: failure()
        run: ls -la mobile_app/bin/ 2>/dev/null || echo "Build failed"
